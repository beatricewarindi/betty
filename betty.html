<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <style>
        .p{
            border-style: dotted solid;
            text-decoration-line: overline underline;
            text-decoration-color: black;
            text-decoration-style: wavy;
            text-align: justify;
            text-emphasis-color: unset;
            border-width: 25px 10px 4px 35px;
            border-color: hsl(0, 100%, 50%);
            border-top: dotted;
             margin-top: 100px;
            margin-bottom: 100px;
            margin-left: 80px;
            margin-right: 150px;
            max-width: 500px;
            background-color: powderblue;
            color: blue;
        }
        .h{
            border: 5px solid red;
            border-left: purple;
            border-right: black;
            border-radius: 5px;
            margin: auto;
            padding-top: 50px;
            padding-bottom: 50px;
            padding-right: 30px;
            padding-left: 80px;
            width: 300px;
            box-sizing: border-box;
            text-align-last: end;
            vertical-align: baseline;
            direction: ltr;
            unicode-bidi: bidi-override;
        }
        .p2{
            vertical-align: text-bottom;
            direction: ltr;
            unicode-bidi: bidi-override;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <form method="post">
        <label for="FName">First Name</label><br>
        <input type="text" id="FName" placeholder="enter name" required name="first name"><br>
        <label for="lname">Last Name</label><br>
        <input type="text" id="lname" placeholder="enter name" required name="last name" >

        <p class="p">hello world</p>
        <h5 class="h">MERRY CHRISMAS</h5>
        <p class="p2">how are you</p>

        

    </form>
</body>
</html>
