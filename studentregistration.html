<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGISTRATION FORM</title>
    <style>
        body{background-color: rgb(97, 5, 133); font-size: x-small; color: azure; text-emphasis-style: inherit; font-family: Verdana, Geneva, Tahoma, sans-serif; font-weight: 100;}
    </style>
</head>
<body>
    <h1 underline>STUDENT REGISTRATION FORM</h1>
    <fieldset>
       <form method="post">
         <label>FIRST NAME</label><br>
        <input type="text" id="name" name="first name"><br> 
        <label>LAST NAME</label><br>
        <input type="text" id="name" name="last name"><br>
        <p class="label">Birthday</p>
            <div class="birthday-row"></div>
             <select name="Day" id="">
                         <option value="23">Day</option>
                         <option value="1">1</option>
                         <option value="2">2</option>
                         <option value="3">3</option>
                         <option value="4">4</option>
                            </select> 
             <select name="Month" id="">
                         <option value="December">Month</option>
                         <option value="1">1</option>
                         <option value="2">2</option>
                         <option value="3">3</option>
                         <option value="4">4</option>
                         <option value="5">5</option>
                            </select> 
             <select name="Year" id="">
                         <option value="2013">Year</option>
                         <option value="1996">1996</option>
                         <option value="1997">1997</option>
                         <option value="1998">1998</option>
                         <option value="1999">1999</option>
                         <option value="2000">2000</option>
                         <option value="2001">2001</option>
                            </select> <br><br>


        <label>EMAIL ID</label><br>
        <input type="email" id="email" name="email"><br><br>
        <label>MOBILE NUMBER</label><br>
        <input type="number" id="tel" name="tel"><br><br>
        <label>GENDER</label>
        <input type="radio" name="male" value="M">Male
        <input type="radio" name="female" value="F">Female <br><br>
        <label>ADDRESS</label><br>
        <textarea></textarea><br><br>
        <label>CITY</label><br>
        <input type="text" name="city" id="city"><br><br>
        <label>PIN CODE</label><br>
        <input type="number"><br><br>
        <label>STATE</label><br>
        <input type="text"><br><br>
        <label>COUNTRY</label><br>
        <input type="text"><br><br>
        <label>HOOBIES</label><br>
        <input type="checkbox" id="drawing" value="drawing">Drawing
        <input type="checkbox" id="singing" value="singing">Singing
        <input type="checkbox" value="dancing">Dancing
        <input type="checkbox" value="sketching">Sketching 
        <input type="checkbox" value="others">Others 
        <input type="text"><br><br>
        <tr>
            <td>QUALIFICATION</td><br><br>
        <td>
            <table>
                <tr>
                    <td>SI.No</td>
                    <td>Examination</td>
                    <td>Board</td>
                    <td>Percentage</td>
                    <td>Year of Passing</td>
                </tr>
                <tr>
                    <td>1</td>
                    <td>Class X</td>
                    <td><input type="text" name="board1"></td>
                    <td><input type="text" name="perc1"></td>
                    <td><input type="text" name="year1"></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Class XII</td>
                    <td><input type="text" name="board2"></td>
                    <td><input type="text" name="perc2"></td>
                    <td><input type="text" name="year2"></td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Graduation</td>
                    <td><input type="text" name="board13"></td>
                    <td><input type="text" name="perc3"></td>
                    <td><input type="text" name="year3"></td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>Masters</td>
                    <td><input type="text" name="board4"></td>
                    <td><input type="text" name="perc4"></td>
                    <td><input type="text" name="year4"></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td>(10 char max)</td>
                    <td>(upto 2 decimal)</td>
                    <td></td>
                </tr>
            </table>
        </td>
        </tr>
        <label>COURSES APPLIED FOR</label>
        <input type="radio" name="BCA" value="BCA">BCA 
        <input type="radio" name="B.Com" value="B.Com">B.Com
        <input type="radio" name="B.Sc" value="B.Sc">B.Sc 
        <input type="radio" name="B.A" value="B.A">B.A <br> <br>

        <button id="submit" type="submit">Submit</button>
        <button id="reset" type="reset">Reset</button>

        

       </form>
    </fieldset>
    
</body>
</html>
