<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started</title>
</head>
<body>
    <h1>Get Started</h1>
  <div class="container">
    <form id="form">
          <div>
        <label for="username">User Name</label>
        <i class="fas fa-user"></i>
        <input type="text" id="username" name="username" placeholder="Joy Shaheb">
    <i class="fas fa-exclamation-cicle failure-icon"></i>
    <i class="far fa-check-circle success-icon"></i>
    <div class="error"></div>
    </div><br><br>
    <div>
        <label for="email">Email</label>
        <i class="far fa-envelope"></i>
        <input type="email" name="email" id="email" placeholder="abc@gmail.com">
        <i class="fas fa-exclamation-cicle failure-icon"></i>
        <i class="far fa-check-circle success-icon"></i>
        <div class="error"></div>
    </div><br><br>
    <div>
        <label for="password">Password</label>
       <span><i class="fa-solid fa-lock"></i></span> 
        <input type="password" name="password" id="password" placeholder="password here">
        <i class="fas fa-exclamation-cicle failure-icon"></i>
        <i class="far fa-check-circle success-icon"></i>
        <div class="error"></div><br><br>
    </div>

    <button id="btn" type="submit">Submit</button>
    </form>
  </div>
    
</body>
</html>
